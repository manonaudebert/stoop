name: Monthly SF full refresh

# The weekly job (weekly_sync.yml) syncs SF incrementally: 311 by :updated_at and
# DBI NOV by date_filed. NOV is republished wholesale by DataSF, so date_filed only
# catches newly-FILED violations — status changes (e.g. a violation resolved) on
# OLDER violations are missed. This monthly full rebuild re-pulls the entire NOV
# dataset (and refreshes the near-static reference tables), truing up open/closed
# status that the incremental weekly can't.

on:
  schedule:
    # 15th of each month at 15:00 UTC — deliberately mid-day and mid-month so it
    # never overlaps the Sunday 06:00 UTC weekly run, regardless of weekday.
    - cron: '0 15 15 * *'
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: read
  issues: write        # allow the failure step to open an alert issue

jobs:
  sf-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run SF full refresh
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python sync_sf.py --full

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Monthly SF full refresh failed — $(date -u +%Y-%m-%d)" \
            --body "The monthly SF full refresh failed. Run log: $RUN_URL"
