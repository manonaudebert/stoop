name: Weekly data sync

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: read
  issues: write        # allow the failure step to open an alert issue

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run sync
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python sync_all.py

      # Fires only when an earlier step failed. Opens a GitHub issue so a failed
      # weekly run is visible and actionable rather than a silent red run in the
      # Actions tab. Uses the built-in GITHUB_TOKEN — no external service needed.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Weekly data sync failed — $(date -u +%Y-%m-%d)" \
            --body "The scheduled data sync failed. Run log: $RUN_URL"
